name: Update data and publish site

on:
  schedule:
    - cron: "17 19 * * 0"     # every Monday 03:17 Singapore time
  workflow_dispatch: {}        # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Arrange files into folders
        run: |
          mkdir -p site/data data scripts
          cp index.html site/index.html
          cp manual_listings.csv data/manual_listings.csv
          cp events.csv data/events.csv
          cp build_data.py scripts/build_data.py
      - name: Build data (OpenStreetMap + data.gov.sg + your sheet)
        run: python scripts/build_data.py
      - name: Add Google Maps key (if set)
        env:
          GMAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          if [ -n "$GMAPS_KEY" ]; then echo "window.GOOGLE_MAPS_KEY='$GMAPS_KEY';" > site/config.js; else echo "window.GOOGLE_MAPS_KEY='';" > site/config.js; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
